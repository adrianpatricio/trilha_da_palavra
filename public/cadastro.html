<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <header id="header" data-pagina="inicio"></header>
    <script src="./js/header.js"></script>

    <main class="main_login">
        <section class="section_login">
            <section class="section_bem-vindo">

            </section>

            <section class="formulario_login">

                </p>

                <span id="mensagem_erro" class="mensagem_erro"></span>

                <label for="ipt_nome">Nome</label>
                <input type="text" id="ipt_nome" placeholder="Seu nome">

                <span id="erro_nome" class="mensagem_erro_campo"></span>

                <label for="ipt_email">E-mail</label>
                <input type="email" id="ipt_email" placeholder="voce@exemplo.com">

                <span id="erro_email" class="mensagem_erro_campo"></span>

                <section class="lado_a_lado">

                        <label for="ipt_senha">Senha</label>
                        <input type="password" id="ipt_senha" placeholder="Mínimo de 6 caracteres">
                        <span id="erro_senha" class="mensagem_erro_campo"></span>
                    </div>

                    <div class="lados">
                        <label for="slc_livros">Livro favorito</label>

                                <option value="4">Números</option>
                                <option value="5">Deuteronômio</option>
                                <option value="6">Josué</option>
                                <option value="7">Juízes</option>
                                <option value="8">Rute</option>
                                <option value="9">1 Samuel</option>
                                <option value="10">2 Samuel</option>
                                <option value="11">1 Reis</option>
                                <option value="12">2 Reis</option>
                                <option value="13">1 Crônicas</option>
                                <option value="14">2 Crônicas</option>
                                <option value="15">Esdras</option>
                                <option value="16">Neemias</option>
                                <option value="17">Ester</option>
                                <option value="18">Jó</option>
                                <option value="19">Salmos</option>
                                <option value="20">Provérbios</option>
                                <option value="21">Eclesiastes</option>
                                <option value="22">Cânticos</option>
                                <option value="23">Isaías</option>
                                <option value="24">Jeremias</option>
                                <option value="25">Lamentações</option>
                                <option value="26">Ezequiel</option>
                                <option value="27">Daniel</option>
                                <option value="28">Oseias</option>
                                <option value="29">Joel</option>
                                <option value="30">Amós</option>
                                <option value="31">Obadias</option>
                                <option value="32">Jonas</option>
                                <option value="33">Miqueias</option>
                                <option value="34">Naum</option>
                                <option value="35">Habacuque</option>
                                <option value="36">Sofonias</option>
                                <option value="37">Ageu</option>
                                <option value="38">Zacarias</option>
                                <option value="39">Malaquias</option>
                            </optgroup>

                            <optgroup label="Novo Testamento">
                                <option value="40">Mateus</option>
                                <option value="41">Marcos</option>
                                <option value="42">Lucas</option>
                                <option value="43">João</option>
                                <option value="44">Atos</option>
                                <option value="45">Romanos</option>
                                <option value="46">1 Coríntios</option>
                                <option value="47">2 Coríntios</option>
                                <option value="48">Gálatas</option>
                                <option value="49">Efésios</option>
                                <option value="50">Filipenses</option>
                                <option value="51">Colossenses</option>
                                <option value="52">1 Tessalonicenses</option>
                                <option value="53">2 Tessalonicenses</option>
                                <option value="54">1 Timóteo</option>
                                <option value="55">2 Timóteo</option>
                                <option value="56">Tito</option>
                                <option value="57">Filemom</option>
                                <option value="58">Hebreus</option>
                                <option value="59">Tiago</option>
                                <option value="60">1 Pedro</option>

                            </optgroup>
                        </select>
                    </div>
                </section>

                <button onclick="cadastrar()" class="botao_entrar">
                    Criar conta
                </button>

                <p class="direcionar_cadastro">
                    Já tem conta? <a href="./login.html">Entrar</a>
                </p>
            </section>
        </section>
    </main>

    <footer id="footer" data-pagina="inicio"></footer>
    <script src="./js/footer.js"></script>

    <script>
        function cadastrar() {
            var nomeVar = document.getElementById("ipt_nome").value.trim();
            var emailVar = document.getElementById("ipt_email").value.trim();
            var senhaVar = document.getElementById("ipt_senha").value;
            var livroVar = document.getElementById("slc_livros").value;

            limparMensagens();

            var temErro = false;

            if (nomeVar == "") {
                mostrarMensagem("erro_nome", "Informe seu nome.");
                temErro = true;
            }

            if (emailVar == "") {
                mostrarMensagem("erro_email", "Informe seu e-mail.");
                temErro = true;
            } else if (!emailVar.includes("@") || !emailVar.includes(".")) {
                mostrarMensagem("erro_email", "Informe um e-mail válido.");
                temErro = true;
            }

            if (senhaVar.length < 6) {
                mostrarMensagem("erro_senha", "A senha deve ter no mínimo 6 caracteres.");
                temErro = true;
            }

            if (temErro) {
                return;
            }

            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nomeServer: nomeVar,
                    emailServer: emailVar,
                    senhaServer: senhaVar,
                    livroFavoritoServer: livroVar
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    mostrarMensagem("mensagem_erro", "Conta criada! Redirecionando para o login...");

                    setTimeout(function () {
                        window.location = "login.html";
                    }, 2000);
                } else {
                    resposta.text().then(function (texto) {
                        mostrarMensagem("mensagem_erro", texto);
                    });
                }
            }).catch(function (erro) {
                console.log(erro);
                mostrarMensagem("mensagem_erro", "Não foi possível conectar ao servidor.");
            });
        }

        function mostrarMensagem(idSpan, texto) {
            var span = document.getElementById(idSpan);
            span.textContent = texto;
            span.classList.add("ativa");
        }

        function limparMensagens() {
            var ids = ["mensagem_erro", "erro_nome", "erro_email", "erro_senha"];

            for (var i = 0; i < ids.length; i++) {
                var span = document.getElementById(ids[i]);
                span.textContent = "";
                span.classList.remove("ativa");
            }
        }
    </script>
</body>
</html>
