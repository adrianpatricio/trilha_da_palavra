<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Trilha da Palavra</title>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <header id="header" data-pagina="cadastro"></header>
    <script src="./js/header.js"></script>

    <main class="main_login">
        <section class="section_login">
            <!-- FORMULÁRIO -->
            <section class="formulario_login formulario_cadastro">
                <section class="cabecalho_login">
                    <h1 class="titulo_login">Criar conta</h1>

                    <p class="subtitulo_login">Crie sua conta para registrar os capítulos que você lê.</p>
                </section>

                <span id="mensagem_erro" class="mensagem_erro"></span>

                <div class="campo">
                    <label for="ipt_nome">Nome</label>
                    <input type="text" id="ipt_nome" placeholder="Seu nome">
                    <span id="erro_nome" class="mensagem_erro_campo"></span>
                </div>

                <div class="campo">
                    <label for="ipt_email">E-mail</label>
                    <input type="email" id="ipt_email" placeholder="voce@exemplo.com">
                    <span id="erro_email" class="mensagem_erro_campo"></span>
                </div>

                <section class="lado_a_lado">
                    <div class="campo">
                        <label for="ipt_senha">Senha</label>
                        <input type="password" id="ipt_senha" placeholder="Mínimo de 6 caracteres">
                        <span id="erro_senha" class="mensagem_erro_campo"></span>
                    </div>

                    <div class="campo">
                        <label for="slc_livros">Livro favorito</label>

                        <select id="slc_livros">
                            <option value="">Selecione um livro</option>

                            <optgroup label="Antigo Testamento" id="grupo_at">
                            </optgroup>

                            <optgroup label="Novo Testamento" id="grupo_nt">
                            </optgroup>
                        </select>
                    </div>
                </section>

                <button onclick="cadastrar()" class="botao_entrar">Criar conta</button>

                <p class="direcionar_cadastro">Já tem conta? <a href="./login.html">Entrar</a></p>
            </section>

            <!-- PAINEL DO VERSÍCULO -->
            <section class="painel_versiculo painel_cadastro">
                <span class="selo_versiculo">O COMEÇO DA SUA TRILHA</span>

                <p class="numero_versiculo">1</p>

                <section>
                    <p class="texto_versiculo texto_versiculo_curto">“No princípio criou Deus os céus e a terra.”</p>

                    <p class="referencia_versiculo">Gênesis 1:1 · ACF</p>
                </section>
            </section>
        </section>
    </main>

    <script src="./js/sessao.js"></script>

    <script>

        function carregarLivros() {
            var grupoAT = document.getElementById("grupo_at");
            var grupoNT = document.getElementById("grupo_nt");

            for (let i = 0; i < livros.length; i++) {
                var opcao = `<option value="${i + 1}">${livros[i]}</option>`;
                
                if (i < 39) {
                    grupoAT.innerHTML += opcao;
                } else {
                    grupoNT.innerHTML += opcao;
                }
            }
        }

        carregarLivros();

        // Confere as regras da senha, caractere por caractere.
        // Devolve um vetor com as regras que não foram cumpridas (vazio = senha certa).
        function validarSenha(senha) {
            var especiais = "!@#$%&*?_-";

            // bandeiras: começam falsas e viram verdadeiras quando o tipo de caractere aparece
            var temMaiuscula = false;
            var temMinuscula = false;
            var temEspecial = false;

            for (var i = 0; i < senha.length; i++) {
                var caractere = senha[i];

                if (caractere >= "A" && caractere <= "Z") {
                    temMaiuscula = true;
                } else if (caractere >= "a" && caractere <= "z") {
                    temMinuscula = true;
                } else if (especiais.includes(caractere)) {
                    temEspecial = true;
                }
            }

            var erros = [];

            if (senha.length < 6) {
                erros.push("A senha deve ter no mínimo 6 caracteres.");
            }

            if (!temMaiuscula) {
                erros.push("A senha precisa ter pelo menos uma letra maiúscula.");
            }

            if (!temMinuscula) {
                erros.push("A senha precisa ter pelo menos uma letra minúscula.");
            }

            if (!temEspecial) {
                erros.push("A senha precisa ter pelo menos um caractere especial (! @ # $ % & * ? _ -).");
            }

            return erros;
        }

        // Mostra cada linha do texto como uma regra separada (o "•" e o espaço vêm do CSS .regra_senha).
        function mostrarRegras(idSpan, texto) {
            var span = document.getElementById(idSpan);
            var regras = texto.split("\n");

            span.textContent = "";

            for (var i = 0; i < regras.length; i++) {
                var item = document.createElement("span");
                item.className = "regra_senha";

                // textContent: o texto entra como texto puro, sem passar pelo HTML (mais seguro que innerHTML)
                item.textContent = regras[i];

                span.appendChild(item);
            }

            span.classList.add("ativa");
        }

        function cadastrar() {
            var nomeVar = document.getElementById("ipt_nome").value.trim();
            var emailVar = document.getElementById("ipt_email").value.trim();
            var senhaVar = document.getElementById("ipt_senha").value;
            var livroVar = document.getElementById("slc_livros").value;

            limparMensagens();

            var temErro = false;

            if (nomeVar == "") {
                mostrarMensagem("erro_nome", "Informe seu nome.");
                temErro = true;
            }

            if (emailVar == "") {
                mostrarMensagem("erro_email", "Informe seu e-mail.");
                temErro = true;
            } else if (!emailVar.includes("@") || !emailVar.includes(".")) {
                mostrarMensagem("erro_email", "Informe um e-mail válido.");
                temErro = true;
            }

            var errosSenha = validarSenha(senhaVar);

            if (errosSenha.length > 0) {
                // todas as regras que falharam, uma por linha
                mostrarRegras("erro_senha", errosSenha.join("\n"));
                temErro = true;
            }

            if (temErro) {
                return;
            }

            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nomeServer: nomeVar,
                    emailServer: emailVar,
                    senhaServer: senhaVar,
                    livroFavoritoServer: livroVar
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    // sucesso: a mensagem fica verde
                    document.getElementById("mensagem_erro").classList.add("mensagem_sucesso");
                    mostrarMensagem("mensagem_erro", "Conta criada! Redirecionando para o login...");

                    setTimeout(function () {
                        window.location = "login.html";
                    }, 2000);
                } else {
                    resposta.text().then(function (texto) {
                        // mais de uma linha = regras da senha (vêm separadas por "\n" do controller)
                        if (texto.includes("\n")) {
                            mostrarRegras("mensagem_erro", texto);
                        } else {
                            mostrarMensagem("mensagem_erro", texto);
                        }
                    });
                }
            }).catch(function (erro) {
                console.log(erro);
                mostrarMensagem("mensagem_erro", "Não foi possível conectar ao servidor.");
            });
        }
    </script>
</body>
</html>
