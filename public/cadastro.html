<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Trilha da Palavra</title>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <header id="header" data-pagina="inicio"></header>
    <script src="./js/header.js"></script>

    <main class="main_login">
        <section class="section_login">
            <section class="section_bem-vindo">
                <p class="bem-vindo">
                    O COMEÇO DA SUA TRILHA
                </p>

                <p class="num_sete">
                    1
                </p>

                <p class="versiculo_mateus">
                    “No princípio criou Deus os céus e a terra.”
                </p>

                <p class="versiculo_legenda">
                    Gênesis 1:1 · ACF
                </p>
            </section>

            <section class="formulario_login">
                <h1 class="titulo_entrar">
                    Criar conta
                </h1>

                <p class="subtitulo_entrar">
                    Crie sua conta para registrar os capítulos que você lê.
                </p>

                <span id="mensagem_erro" class="mensagem_erro"></span>

                <label for="ipt_nome">Nome</label>
                <input type="text" id="ipt_nome" placeholder="Seu nome">

                <span id="erro_nome" class="mensagem_erro_campo"></span>

                <label for="ipt_email">E-mail</label>
                <input type="email" id="ipt_email" placeholder="voce@exemplo.com">

                <span id="erro_email" class="mensagem_erro_campo"></span>

                <section class="lado_a_lado">
                    <div class="lados">
                        <label for="ipt_senha">Senha</label>
                        <input type="password" id="ipt_senha" placeholder="Mínimo de 6 caracteres">
                        <span id="erro_senha" class="mensagem_erro_campo"></span>
                    </div>

                    <div class="lados">
                        <label for="slc_livros">Livro favorito</label>
                        
                        <select id="slc_livros">
                            <option value="">Selecione um livro</option>

                            <optgroup label="Antigo Testamento" id="grupo_at">
                            </optgroup>

                            <optgroup label="Novo Testamento" id="grupo_nt">
                            </optgroup>
                        </select>
                    </div>
                </section>

                <button onclick="cadastrar()" class="botao_entrar">
                    Criar conta
                </button>

                <p class="direcionar_cadastro">
                    Já tem conta? <a href="./login.html">Entrar</a>
                </p>
            </section>
        </section>
    </main>

    <footer id="footer" data-pagina="inicio"></footer>
    <script src="./js/footer.js"></script>
    <script src="./js/sessao.js"></script>

    <script>
        var livros = [
            "Gênesis", 
            "Êxodo", 
            "Levítico", 
            "Números", 
            "Deuteronômio", 
            "Josué", 
            "Juízes", 
            "Rute",
            "1 Samuel", 
            "2 Samuel", 
            "1 Reis", 
            "2 Reis", 
            "1 Crônicas", 
            "2 Crônicas", 
            "Esdras", 
            "Neemias",
            "Ester", 
            "Jó", 
            "Salmos", 
            "Provérbios", 
            "Eclesiastes", 
            "Cânticos", 
            "Isaías", 
            "Jeremias",
            "Lamentações", 
            "Ezequiel", 
            "Daniel", 
            "Oseias", 
            "Joel", 
            "Amós", 
            "Obadias", 
            "Jonas",
            "Miqueias", 
            "Naum", 
            "Habacuque", 
            "Sofonias", 
            "Ageu", 
            "Zacarias", 
            "Malaquias",
            "Mateus", 
            "Marcos", 
            "Lucas", 
            "João", 
            "Atos", 
            "Romanos", 
            "1 Coríntios", 
            "2 Coríntios",
            "Gálatas", 
            "Efésios", 
            "Filipenses", 
            "Colossenses", 
            "1 Tessalonicenses", 
            "2 Tessalonicenses",
            "1 Timóteo", 
            "2 Timóteo", 
            "Tito", 
            "Filemom", 
            "Hebreus", 
            "Tiago", 
            "1 Pedro", 
            "2 Pedro",
            "1 João", 
            "2 João", 
            "3 João", 
            "Judas", 
            "Apocalipse"
        ];

        function carregarLivros() {
            var grupoAT = document.getElementById("grupo_at");
            var grupoNT = document.getElementById("grupo_nt");

            for (let i = 0; i < livros.length; i++) {
                var opcao = `<option value="${i + 1}">${livros[i]}</option>`;
                
                if (i < 39) {
                    grupoAT.innerHTML += opcao;
                } else {
                    grupoNT.innerHTML += opcao;
                }
            }
        }

        carregarLivros();

        function cadastrar() {
            var nomeVar = document.getElementById("ipt_nome").value.trim();
            var emailVar = document.getElementById("ipt_email").value.trim();
            var senhaVar = document.getElementById("ipt_senha").value;
            var livroVar = document.getElementById("slc_livros").value;

            limparMensagens();

            var temErro = false;

            if (nomeVar == "") {
                mostrarMensagem("erro_nome", "Informe seu nome.");
                temErro = true;
            }

            if (emailVar == "") {
                mostrarMensagem("erro_email", "Informe seu e-mail.");
                temErro = true;
            } else if (!emailVar.includes("@") || !emailVar.includes(".")) {
                mostrarMensagem("erro_email", "Informe um e-mail válido.");
                temErro = true;
            }

            if (senhaVar.length < 6) {
                mostrarMensagem("erro_senha", "A senha deve ter no mínimo 6 caracteres.");
                temErro = true;
            }

            if (temErro) {
                return;
            }

            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nomeServer: nomeVar,
                    emailServer: emailVar,
                    senhaServer: senhaVar,
                    livroFavoritoServer: livroVar
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    mostrarMensagem("mensagem_erro", "Conta criada! Redirecionando para o login...");

                    setTimeout(function () {
                        window.location = "login.html";
                    }, 2000);
                } else {
                    resposta.text().then(function (texto) {
                        mostrarMensagem("mensagem_erro", texto);
                    });
                }
            }).catch(function (erro) {
                console.log(erro);
                mostrarMensagem("mensagem_erro", "Não foi possível conectar ao servidor.");
            });
        }
    </script>
</body>
</html>
