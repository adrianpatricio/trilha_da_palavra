<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Trilha da Palavra</title>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <header id="header" data-pagina="login"></header>
    <script src="./js/header.js"></script>

    <main class="main_login">
        <section class="section_login">
            <!-- FORMULÁRIO -->
            <section class="formulario_login">
                <section class="cabecalho_login">
                    <h1 class="titulo_login">Entrar</h1>

                    <p class="subtitulo_login">Entre para continuar sua leitura.</p>
                </section>

                <span id="mensagem_erro" class="mensagem_erro"></span>

                <div class="campo">
                    <label for="ipt_email">E-mail</label>
                    <input type="email" id="ipt_email" placeholder="voce@exemplo.com">
                    <span id="erro_email" class="mensagem_erro_campo"></span>
                </div>

                <div class="campo">
                    <label for="ipt_senha">Senha</label>
                    <input type="password" id="ipt_senha" placeholder="sua senha">
                    <span id="erro_senha" class="mensagem_erro_campo"></span>
                </div>

                <button onclick="entrar()" class="botao_entrar">
                    Entrar

                    <svg width="16" height="16" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3.75 9H14.25M9 14.25L14.25 9L9 3.75" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <p class="direcionar_cadastro">Ainda não tem conta? <a href="./cadastro.html">Cadastre-se</a></p>
            </section>

            <!-- PAINEL DO VERSÍCULO -->
            <section class="painel_versiculo">
                <span class="selo_versiculo">BEM-VINDO DE VOLTA</span>

                <p class="numero_versiculo">7</p>

                <section>
                    <p class="texto_versiculo">“Peçam, e será dado a vocês; busquem e vocês encontrarão; batam, e a porta será aberta a vocês.”</p>

                    <p class="referencia_versiculo">Mateus 7:7 · NVI</p>
                </section>
            </section>
        </section>
    </main>

    <script src="./js/sessao.js"></script>

    <script>
        function entrar() {
            var emailVar = document.getElementById("ipt_email").value.trim();
            var senhaVar = document.getElementById("ipt_senha").value;

            limparMensagens();

            var temErro = false;

            if (emailVar == "") {
                mostrarMensagem("erro_email", "Informe seu e-mail.");
                temErro = true;
            }

            if (senhaVar == "") {
                mostrarMensagem("erro_senha", "Informe sua senha.");
                temErro = true;
            }

            if (temErro) {
                return;
            }

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: emailVar,
                    senhaServer: senhaVar
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (json) {
                        sessionStorage.ID_USUARIO = json.id;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.TIPO_USUARIO = json.tipo;

                        window.location = "inicio.html";
                    });
                } else {
                    resposta.text().then(function (texto) {
                        mostrarMensagem("mensagem_erro", texto);
                    });
                }
            }).catch(function (erro) {
                console.log(erro);
                mostrarMensagem("mensagem_erro", "Não foi possível conectar ao servidor.");
            });
        }
    </script>
</body>
</html>
