<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ínicio</title>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <header id="header" data-pagina="inicio"></header>
    <script src="./js/header.js"></script>

    <main class="main_login">
        <section class="section_login">
            <section class="section_bem-vindo">
                <p class="bem-vindo">
                    Bem-vindo de volta
                </p>

                <p class="num_sete">
                    7
                </p>

                <p class="versiculo_mateus">
                    “Peçam, e será dado a vocês; busquem e vocês encontrarão; batam, e a porta será aberta a vocês.”
                </p>

                <p class="versiculo_legenda">
                    Mateus 7:7 · NVI
                </p>
            </section>

            <section class="formulario_login">
                <h1 class="titulo_entrar">
                    Entrar
                </h1>

                <p class="subtitulo_entrar">
                    Entre para continuar sua leitura.
                </p>

                <span id="mensagem_erro" class="mensagem_erro"></span>

                <label for="ipt_email">E-mail</label>
                <input type="email" id="ipt_email" placeholder="voce@exemplo.com">

                <span id="erro_email" class="mensagem_erro_campo"></span>

                <label for="ipt_senha">Senha</label>
                <input type="password" id="ipt_senha" placeholder="sua senha">

                <span id="erro_senha" class="mensagem_erro_campo"></span>

                <button onclick="entrar()" class="botao_entrar">
                    Entrar
                
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0.65625 5.90625H11.1562M5.90625 11.1562L11.1562 5.90625L5.90625 0.65625" stroke="currentColor" stroke-width="1.3125" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <p class="direcionar_cadastro">
                    Ainda não tem conta? <a href="./cadastro.html">Cadastre-se</a> 
                </p>
            </section>
        </section>
    </main>

    <footer id="footer" data-pagina="inicio"></footer>
    <script src="./js/footer.js"></script>

    <script>
        function entrar() {
            var emailVar = document.getElementById("ipt_email").value.trim();
            var senhaVar = document.getElementById("ipt_senha").value;

            limparMensagens();

            var temErro = false;

            if (emailVar == "") {
                mostrarMensagem("erro_email", "Informe seu e-mail.");
                temErro = true;
            }

            if (senhaVar == "") {
                mostrarMensagem("erro_senha", "Informe sua senha.");
                temErro = true;
            }

            if (temErro) {
                return;
            }

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: emailVar,
                    senhaServer: senhaVar
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (json) {
                        sessionStorage.ID_USUARIO = json.id;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.TIPO_USUARIO = json.tipo;

                        window.location = "index.html";
                    });
                } else {
                    resposta.text().then(function (texto) {
                        mostrarMensagem("mensagem_erro", texto);
                    });
                }
            }).catch(function (erro) {
                console.log(erro);
                mostrarMensagem("mensagem_erro", "Não foi possível conectar ao servidor.");
            });
        }

        function mostrarMensagem(idSpan, texto) {
            var span = document.getElementById(idSpan);
            span.textContent = texto;
            span.classList.add("ativa");
        }

        function limparMensagens() {
            var ids = ["mensagem_erro", "erro_email", "erro_senha"];

            for (var i = 0; i < ids.length; i++) {
                var span = document.getElementById(ids[i]);
                span.textContent = "";
                span.classList.remove("ativa");
            }
        }
    </script>
</body>
</html>
